name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      strip:
        description: Strip debug info from the binary (release packages)
        type: boolean
        default: false
    outputs:
      artifact:
        description: Name of the uploaded artifact with the .deb
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    container: swift:6.4.0-bookworm
    # The container's default shell is sh (dash); every step uses bash, as on the hosted runners.
    defaults:
      run:
        shell: bash

    outputs:
      artifact: wirenhome-bridge-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends dpkg-dev

      - name: Run the tests
        run: |
          set -o pipefail
          # On failure repeat the important lines at the very end, where they are easy to find.
          swift test 2>&1 | tee test.log || {
            echo "===== Failures and HomeKit server log ====="
            grep -E "✘|error:|HomeKit (server|connection|accepted)|HAP #|verify refused" test.log
            exit 1
          }

      # Swift Build in 6.4.0 drops Foundation's static deps (swiftlang/swift-build#1764, fixed in 6.4.2).
      - name: Build the binary
        run: swift build -c release --build-system native --static-swift-stdlib

      - name: Build the package
        run: |
          VERSION="$(packaging/version.sh)"
          BINARY="$(swift build -c release --build-system native --static-swift-stdlib --show-bin-path)/wirenhome-bridge"
          if [ "${{ inputs.strip }}" = "true" ]; then
            strip --strip-unneeded "$BINARY"
          fi
          ls -l "$BINARY"
          packaging/build-deb.sh "$VERSION" "$BINARY" dist
          dpkg-deb --info dist/*.deb

      - name: Attach the package to the run
        uses: actions/upload-artifact@v7
        with:
          name: wirenhome-bridge-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
