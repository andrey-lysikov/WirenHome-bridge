name: Build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Name of the uploaded artifact with the .deb
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    container: swift:6.4-bookworm

    outputs:
      artifact: wb-homekit-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends dpkg-dev

      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          # On failure repeat the important lines at the very end, where they are easy to find.
          swift test 2>&1 | tee test.log || {
            echo "===== Failures and HomeKit server log ====="
            grep -E "✘|error:|HomeKit (server|connection|accepted)|HAP #|verify refused" test.log
            exit 1
          }

      # The native build system links Foundation's own static dependencies (CoreFoundation, ICU);
      # the Swift Build backend leaves them out with --static-swift-stdlib.
      - name: Build the binary
        run: swift build -c release --build-system native --static-swift-stdlib

      - name: Build the package
        run: |
          VERSION="$(packaging/version.sh)"
          packaging/build-deb.sh "$VERSION" "$(swift build -c release --build-system native --static-swift-stdlib --show-bin-path)/wb-homekit" dist
          dpkg-deb --info dist/*.deb

      - name: Attach the package to the run
        uses: actions/upload-artifact@v7
        with:
          name: wb-homekit-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
