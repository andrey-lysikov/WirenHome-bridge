name: Release

on:
  push:
    branches: [main]
    paths:
      - Sources/WirenHome/Version.swift
      - changelog.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-26.04

    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      notes: ${{ steps.check.outputs.notes }}
      rebuild: ${{ steps.check.outputs.rebuild }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this is a release
        id: check
        run: |
          VERSION="$(packaging/version.sh)"
          echo "Version in the project: $VERSION"

          TAGS=($(git tag --list 'v[0-9]*' --sort=-v:refname))
          PREVIOUS="${TAGS[0]:-}"
          echo "Newest tag: ${PREVIOUS:-(none)}"

          NEWER=true
          if [ -n "$PREVIOUS" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${PREVIOUS#v}" "$VERSION" | sort -V | tail -n 1)"
            [ "$HIGHEST" = "$VERSION" ] && [ "${PREVIOUS#v}" != "$VERSION" ] || NEWER=false
          fi

          # A manual run on the released version rebuilds that release from the current commit.
          REBUILD=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$PREVIOUS" = "v$VERSION" ]; then
            REBUILD=true
            NEWER=true
            PREVIOUS="${TAGS[1]:-}"
            echo "Manual run on $VERSION: rebuilding the release"
          fi

          # The "## <version>" section of changelog.md without surrounding blank lines.
          SECTION=()
          FOUND=false
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            if [[ $LINE =~ ^##[[:space:]] ]]; then
              $FOUND && break
              read -r -a WORDS <<< "$LINE"
              [ "${#WORDS[@]}" -eq 2 ] && [ "${WORDS[1]}" = "$VERSION" ] && FOUND=true
              continue
            fi
            $FOUND && SECTION+=("$LINE")
          done < changelog.md
          FIRST=-1
          LAST=-1
          for I in "${!SECTION[@]}"; do
            if [[ ${SECTION[I]} =~ [^[:space:]] ]]; then
              [ "$FIRST" -lt 0 ] && FIRST=$I
              LAST=$I
            fi
          done
          NOTES=""
          if [ "$FIRST" -ge 0 ]; then
            printf -v NOTES '%s\n' "${SECTION[@]:FIRST:LAST-FIRST+1}"
            NOTES="${NOTES%$'\n'}"
          fi

          DESCRIBED=false
          [[ $NOTES =~ [^[:space:]] ]] && DESCRIBED=true
          echo "Higher than the tag: $NEWER; described in changelog.md: $DESCRIBED"

          if [ "$NEWER" != true ] || [ "$DESCRIBED" != true ]; then
            if [ "$NEWER" != true ]; then
              REASON="version $VERSION is not higher than $PREVIOUS"
            else
              REASON="changelog.md has no section for $VERSION"
            fi
            echo "No release: $REASON"
            echo "release=false" >> "$GITHUB_OUTPUT"
            printf '## No release\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TAG="v$VERSION"
          if [ -n "$PREVIOUS" ]; then
            LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG"
          else
            LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$TAG"
          fi

          {
            echo "release=true"
            echo "rebuild=$REBUILD"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo
            echo "**Full list of changes:** $LINK"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      strip: true

  release:
    needs: [check, build]
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - uses: actions/checkout@v7
        with:
          path: source

      - name: Update the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "APT_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          KEY=""
          while IFS=: read -r -a FIELDS; do
            if [ "${FIELDS[0]}" = "fpr" ]; then
              KEY="${FIELDS[9]}"
              break
            fi
          done < <(gpg --list-secret-keys --with-colons)

          # gh-pages holds the repository; created on the first release.
          git clone --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" site \
            || { git init -b gh-pages site && git -C site remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"; }
          cd site
          mkdir -p pool/main dists/stable/main/binary-arm64
          cp ../dist/*.deb pool/main/
          # Keep the five newest packages so the Pages site stays small.
          ls -1 pool/main/*.deb | sort -V | head -n -5 | xargs -r rm -f
          # Stable download link outside pool, so the index does not list it twice.
          cp ../dist/*.deb wb-homekit_latest_arm64.deb

          apt-ftparchive packages pool > dists/stable/main/binary-arm64/Packages
          gzip -9 -kf dists/stable/main/binary-arm64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=WirenHome \
            -o APT::FTPArchive::Release::Label=WirenHome \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=arm64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > ../Release
          mv ../Release dists/stable/Release
          gpg --batch --yes --default-key "$KEY" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --default-key "$KEY" -abs -o dists/stable/Release.gpg dists/stable/Release
          cp ../source/packaging/wb-homekit.gpg wb-homekit.gpg
          touch .nojekyll

          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "wb-homekit ${{ needs.check.outputs.version }}"
            git push -q origin gh-pages
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.check.outputs.notes }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > release-notes.md
          if [ "${{ needs.check.outputs.rebuild }}" = "true" ]; then
            # Same version rebuilt: the tag follows the current commit, the package and notes are replaced.
            git -C source tag -f "$TAG" "$GITHUB_SHA"
            git -C source push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
